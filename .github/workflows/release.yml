# Release build for the Rustify fork of KomoringHeights.
#
# Pushing a `kh-v*` tag builds the USI engine (USER_ENGINE edition, which
# carries `user tsume_answer` — see docs/idea/tsume-mode.md,
# 「完全作解答モード（df-pn ベース）」) and publishes a GitHub Release with:
#
#   KomoringHeights-<tag>-linux-x86_64-avx2   static ELF, no runtime deps
#   KomoringHeights-<tag>-windows-x64-avx2.exe   static MinGW (UCRT64) build
#   SHA256SUMS
#
# The Linux binary is what Shogi Dojo's tsume agent downloads and verifies
# (infra/k8s/rustify/51-tsume-agent.yaml in the app repo), so it is linked
# statically: it then runs in any x86-64 image regardless of its glibc.
#
# `workflow_dispatch` builds and smoke-tests without publishing, unless a tag
# is given, in which case it (re)publishes that tag's release.
#
# The previous version of this file used actions/checkout@v2,
# upload-artifact@v2 and actions/create-release@v1, which GitHub now refuses
# to run; it also built only Windows/Android/macOS archives.
name: Release

on:
  push:
    tags:
      - "kh-v*"
      - "kh-V*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for (empty: build only)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # A 1-move tsume: G*5b is the only mate. Used to prove the built binary
  # answers `user tsume_answer` before anything is published.
  SMOKE_SFEN: "4k4/9/4P4/9/9/9/9/9/9 b G2r2b3g4s4n4l17p 1"
  # An 11-move tsume whose last defence is an interposition at 2d where every piece
  # is mated the same way (N*3g). The answer must show the cheapest legal piece
  # (L*2d; a pawn would be 二歩), not the rook the move generator lists first, and
  # the answer tree must branch at 5c (promote or not) and merge the other pieces
  # of that interposition into "also".
  INTERPOSE_SFEN: "9/9/9/5+p3/6p2/7p1/3G1k3/4R3L/3B2+p1+B b Nr3g4s3n3l14p 1"

jobs:
  build-linux:
    name: Linux x86-64 (AVX2, static)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build
        working-directory: source
        run: |
          mkdir -p ../dist
          make -j"$(nproc)" normal \
            YANEURAOU_EDITION=USER_ENGINE \
            TARGET_CPU=AVX2 \
            COMPILER=g++ \
            EXTRA_LDFLAGS=-static \
            TARGET=../dist/KomoringHeights-linux-x86_64-avx2
          file ../dist/KomoringHeights-linux-x86_64-avx2
          # Fail if anything dynamic slipped in.
          if ldd ../dist/KomoringHeights-linux-x86_64-avx2 2>&1 | grep -q '=>'; then
            ldd ../dist/KomoringHeights-linux-x86_64-avx2
            exit 1
          fi

      - name: Smoke test (user tsume_answer)
        run: |
          out=$(printf 'usi\nisready\nposition sfen %s\nuser tsume_answer 1000 5000\nquit\n' "$SMOKE_SFEN" \
            | timeout 120 ./dist/KomoringHeights-linux-x86_64-avx2)
          echo "$out" | tail -n 20
          echo "$out" | grep -F 'info string tsume_answer {' | grep -F '"status":"mate"' | grep -F '"matePly":1'

      - name: Regression (answer tree, cheapest equal interposition)
        run: |
          out=$(printf 'usi\nsetoption name USI_Hash value 256\nsetoption name Threads value 1\nisready\nuser tsume_answer_tree 300 120000\nposition sfen %s\nuser tsume_answer 1000 5000\nquit\n' "$INTERPOSE_SFEN" \
            | timeout 300 ./dist/KomoringHeights-linux-x86_64-avx2)
          line=$(echo "$out" | grep -F 'info string tsume_answer {' | tail -n 1)
          echo "$line"
          echo "$line" | grep -F '"answer":"6g5g 4g3f 5g4f 3f2e 5h5c+ 2e3d 6i2e 3d2e 5c2c L*2d N*3g"'
          echo "$line" | grep -F '"truncated":false,"unresolved":0'
          echo "$line" | grep -F '{"usi":"5h5c","mate":6'
          echo "$line" | grep -F '{"usi":"L*2d","mate":1,"also":["N*2d","S*2d","G*2d","B*2d","R*2d"]'

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Windows x64 (AVX2, MinGW UCRT64 static)
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build
        working-directory: source
        run: |
          mkdir -p ../dist
          make -j"$(nproc)" normal \
            YANEURAOU_EDITION=USER_ENGINE \
            TARGET_CPU=AVX2 \
            COMPILER=g++ \
            TARGET=../dist/KomoringHeights-windows-x64-avx2.exe

      - name: Smoke test (user tsume_answer)
        run: |
          out=$(printf 'usi\nisready\nposition sfen %s\nuser tsume_answer 1000 5000\nquit\n' "$SMOKE_SFEN" \
            | ./dist/KomoringHeights-windows-x64-avx2.exe)
          echo "$out" | tail -n 20
          echo "$out" | grep -F 'info string tsume_answer {' | grep -F '"status":"mate"' | grep -F '"matePly":1'

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/kh-') || inputs.tag != ''
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Name assets after the tag and checksum them
        run: |
          mkdir release
          cp artifacts/KomoringHeights-linux-x86_64-avx2 "release/KomoringHeights-${TAG}-linux-x86_64-avx2"
          cp artifacts/KomoringHeights-windows-x64-avx2.exe "release/KomoringHeights-${TAG}-windows-x64-avx2.exe"
          chmod +x "release/KomoringHeights-${TAG}-linux-x86_64-avx2"
          cp Copying.txt release/Copying.txt
          (cd release && sha256sum KomoringHeights-* Copying.txt > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          KomoringHeights (rustify-app fork) built from \`${GITHUB_SHA}\`.

          This build carries the **完全作解答モード（df-pn ベース）**:

          \`\`\`
          position sfen <sfen>
          user tsume_answer [部分問題1つあたりms=3000] [全体df-pn ms=30000] [作意USI手順...]
          \`\`\`

          It solves under 詰将棋 rules — futile interpositions (無駄合) are not
          counted as defences, the defender takes the longest line and avoids
          leaving the attacker spare pieces — and checks the answer for 余詰.
          The result is one \`info string tsume_answer {json}\` line. See
          [docs/idea/tsume-mode.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/idea/tsume-mode.md).

          | asset | target |
          |---|---|
          | \`KomoringHeights-${TAG}-linux-x86_64-avx2\` | Linux x86-64, AVX2, statically linked |
          | \`KomoringHeights-${TAG}-windows-x64-avx2.exe\` | Windows x64, AVX2, statically linked |

          Verify with \`sha256sum -c SHA256SUMS\`. Licensed under GPLv3 (Copying.txt).
          EOF

      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" release/* \
              --title "KomoringHeights ${TAG} (tsume_answer)" \
              --notes-file notes.md \
              --verify-tag
          fi
